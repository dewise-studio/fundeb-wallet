<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundeb Wallet - Transactions</title>

  <style>
    :root {
      --primary-dark: #0d1527;
      --accent-green: #10b981;
      --accent-green-light: #d1fae5;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    [data-theme="dark"] {
      --primary-dark: #0f172a;
      --accent-green: #10b981;
      --accent-green-light: rgba(16, 185, 129, 0.2);
      --bg-light: #0b0f19;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-main);
      padding-bottom: 80px;
    }

    .app-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    .header-title { font-size: 1.1rem; font-weight: 700; }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .search-bar {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--primary-dark);
      color: #ffffff;
      border-color: var(--primary-dark);
    }

    [data-theme="dark"] .tab-btn.active {
      background: var(--accent-green);
      border-color: var(--accent-green);
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 18px;
      border: 1px solid var(--border-color);
    }

    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .transaction-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .transaction-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .tx-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--bg-light);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .tx-avatar.bg-emerald-light {
      background: var(--accent-green-light);
      color: var(--accent-green);
    }

    .tx-details { flex: 1; margin-left: 12px; }
    .tx-title { display: block; font-weight: 600; font-size: 0.9rem; }
    .tx-sub { font-size: 0.75rem; color: var(--text-muted); }
    .tx-amount { font-size: 0.9rem; font-weight: 700; }
    .tx-amount.negative { color: var(--text-main); }
    .tx-amount.positive { color: var(--accent-green); }

    .mobile-bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 62px;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 900;
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 500;
      gap: 3px;
    }

    .bottom-nav-item.active { color: var(--text-main); font-weight: 700; }
    .bottom-nav-item .icon { font-size: 1.25rem; }
  </style>
</head>
<body>

  <header class="app-header">
    <a href="index.html" class="back-btn" aria-label="Go back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </a>
    <span class="header-title">Transaction History</span>
  </header>

  <main class="container">
    <input type="text" id="search-input" class="search-bar" placeholder="🔍 Search transactions by name or category..." oninput="filterTransactions()" />

    <div class="filter-tabs">
      <button class="tab-btn active" id="tab-all" onclick="setFilter('all')">All</button>
      <button class="tab-btn" id="tab-in" onclick="setFilter('inflow')">Inflow</button>
      <button class="tab-btn" id="tab-out" onclick="setFilter('outflow')">Outflow</button>
    </div>

    <div class="card">
      <div class="transaction-list" id="full-tx-container">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <nav class="mobile-bottom-nav">
    <a href="index.html" class="bottom-nav-item">
      <span class="icon">🏠</span><span>Home</span>
    </a>
    <a href="transfer.html" class="bottom-nav-item">
      <span class="icon">✈</span><span>Pay</span>
    </a>
    <a href="cards.html" class="bottom-nav-item">
      <span class="icon">💳</span><span>Cards</span>
    </a>
    <a href="savings.html" class="bottom-nav-item">
      <span class="icon">💰</span><span>Grow</span>
    </a>
    <a href="profile.html" class="bottom-nav-item">
      <span class="icon">👤</span><span>You</span>
    </a>
  </nav>

  <script>
    let currentFilterType = 'all';

    function initTheme() {
      const savedTheme = localStorage.getItem('jw_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    function getTransactions() {
      return JSON.parse(localStorage.getItem('jw_transactions_list')) || [
        { title: 'Ade Transfer', category: 'Transfer', amount: -15000, time: '10m ago', avatar: 'A', type: 'negative' },
        { title: 'Paystack Settlement', category: 'Business', amount: 1200000, time: 'Yesterday', avatar: 'PS', type: 'positive' }
      ];
    }

    function setFilter(type) {
      currentFilterType = type;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`tab-${type === 'all' ? 'all' : type === 'inflow' ? 'in' : 'out'}`).classList.add('active');
      filterTransactions();
    }

    function filterTransactions() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const txs = getTransactions();
      const container = document.getElementById('full-tx-container');
      container.innerHTML = '';

      const filtered = txs.filter(tx => {
        const matchesQuery = tx.title.toLowerCase().includes(query) || tx.category.toLowerCase().includes(query);
        if (currentFilterType === 'inflow') return matchesQuery && tx.amount > 0;
        if (currentFilterType === 'outflow') return matchesQuery && tx.amount < 0;
        return matchesQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:20px 0; font-size:0.85rem;">No matching transactions found.</p>`;
        return;
      }

      filtered.forEach(tx => {
        const isPos = tx.amount > 0;
        const formattedAmt = `${isPos ? '+' : '-'}₦${Math.abs(tx.amount).toLocaleString('en-NG', {minimumFractionDigits: 2})}`;
        const avatarClass = isPos ? 'bg-emerald-light' : '';

        const html = `
          <div class="transaction-item">
            <div class="tx-avatar ${avatarClass}">${tx.avatar}</div>
            <div class="tx-details">
              <span class="tx-title">${tx.title}</span>
              <span class="tx-sub">${tx.time} · ${tx.category}</span>
            </div>
            <span class="tx-amount ${isPos ? 'positive' : 'negative'}">${formattedAmt}</span>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      filterTransactions();
    });
  </script>
</body>
</html>
