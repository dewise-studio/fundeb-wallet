<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fundeb Wallet - Reset Password</title>
  
  <!-- PWA Manifest & Theme Integration -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d1527" />

  <style>
    :root {
      --primary-dark: #0d1527;
      --accent-green: #10b981;
      --accent-green-light: rgba(16, 185, 129, 0.12);
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 10px 25px -5px rgba(0,0,0,0.05);
    }

    [data-theme="dark"] {
      --primary-dark: #0f172a;
      --accent-green: #10b981;
      --accent-green-light: rgba(16, 185, 129, 0.2);
      --bg-light: #0b0f19;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --shadow-sm: 0 10px 25px -5px rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-main); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; position: relative; }

    /* Top PWA Installation Bar */
    .pwa-top-bar {
      position: absolute;
      top: 16px;
      right: 16px;
    }
    .pwa-install-btn {
      background-color: var(--accent-green);
      color: #ffffff;
      border: none;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: none;
      transition: opacity 0.2s;
    }
    .pwa-install-btn:hover { opacity: 0.9; }

    .auth-card { background: var(--card-bg); padding: 28px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .auth-header { text-align: center; margin-bottom: 24px; }
    .auth-logo { height: 42px; margin-bottom: 12px; }
    .auth-header h2 { font-size: 1.4rem; color: var(--text-main); margin-bottom: 4px; font-weight: 700; }
    .auth-header p { font-size: 0.875rem; color: var(--text-muted); }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-main); margin-bottom: 6px; }
    
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-wrapper input { width: 100%; padding: 12px; padding-right: 40px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.95rem; outline: none; background: var(--bg-light); color: var(--text-main); }
    .input-wrapper input:focus { border-color: var(--accent-green); }
    
    .toggle-password-btn {
      position: absolute; right: 12px; background: none; border: none;
      color: var(--text-muted); cursor: pointer; font-size: 0.9rem;
    }

    .btn-primary { width: 100%; padding: 14px; background-color: var(--primary-dark); color: #ffffff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.95; }
    [data-theme="dark"] .btn-primary { background-color: var(--accent-green); }
    
    .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 4px; display: block; }

    .nav-links { display: flex; justify-content: space-between; margin-top: 16px; font-size: 0.85rem; }
    .nav-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
    .nav-links a:hover { color: var(--accent-green); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(13, 21, 39, 0.6); backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-overlay.hidden { display: none; }
    .modal-card { background: var(--card-bg); color: var(--text-main); padding: 24px; border-radius: 16px; width: 90%; max-width: 360px; border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
    .otp-alert-box { background: var(--accent-green-light); border-left: 4px solid var(--accent-green); padding: 12px; margin: 16px 0; border-radius: 6px; font-size: 0.9rem; color: var(--text-main); }
  </style>
</head>
<body>

  <!-- Top Action Area for PWA Prompt -->
  <div class="pwa-top-bar">
    <button id="pwa-install-btn" class="pwa-install-btn">📲 Install App</button>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <img src="fundeb.png" alt="Fundeb Wallet Logo" class="auth-logo" />
      <h2>Reset Password</h2>
      <p>Verify your details to set a new password</p>
    </div>

    <form id="reset-form" onsubmit="handleResetVerification(event)">
      <div class="form-group">
        <label for="phone">Registered Phone Number (10 Digits)</label>
        <div class="input-wrapper">
          <input type="tel" id="phone" maxlength="10" pattern="\d{10}" placeholder="e.g. 8012345678" required />
        </div>
        <small class="error-msg" id="reset-error"></small>
      </div>

      <div class="form-group">
        <label for="pin">4-Digit Security PIN</label>
        <div class="input-wrapper">
          <input type="password" id="pin" maxlength="4" pattern="\d{4}" placeholder="••••" required />
          <button type="button" class="toggle-password-btn" onclick="toggleInputVisibility('pin')">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label for="new-password">New Password</label>
        <div class="input-wrapper">
          <input type="password" id="new-password" placeholder="Enter new password" required />
          <button type="button" class="toggle-password-btn" onclick="toggleInputVisibility('new-password')">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn-primary">Verify & Set Password</button>

      <div class="nav-links">
        <a href="login.html">← Back to Login</a>
        <a href="register.html">Register Account</a>
      </div>
    </form>
  </div>

  <!-- OTP Verification Modal -->
  <div id="otp-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 style="margin-bottom: 4px;">Enter Reset OTP</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted);">An automatic OTP has been generated to approve this change:</p>
      
      <div class="otp-alert-box">
        Your OTP code is: <strong id="auto-generated-otp" style="color: var(--accent-green);">123456</strong>
      </div>

      <form onsubmit="confirmPasswordReset(event)">
        <div class="form-group">
          <div class="input-wrapper">
            <input type="text" id="user-otp" maxlength="6" placeholder="Enter 6-digit OTP" required />
          </div>
          <small class="error-msg" id="otp-error"></small>
        </div>
        <button type="submit" class="btn-primary">Confirm New Password</button>
      </form>
    </div>
  </div>

  <script>
    // Initialize saved dark/light theme
    function initTheme() {
      const savedTheme = localStorage.getItem('jw_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
    }

    // Input visibility toggle
    function toggleInputVisibility(id) {
      const field = document.getElementById(id);
      if (field.type === "password") {
        field.type = "text";
      } else {
        field.type = "password";
      }
    }

    function handleResetVerification(e) {
      e.preventDefault();

      const phone = document.getElementById('phone').value.trim();
      const pin = document.getElementById('pin').value.trim();
      const newPassword = document.getElementById('new-password').value;
      const resetError = document.getElementById('reset-error');

      // Fetch registered users
      const existingUsers = JSON.parse(localStorage.getItem('jw_registered_users') || '[]');
      const userIndex = existingUsers.findIndex(u => u.phone === phone);

      if (userIndex === -1) {
        resetError.textContent = "Account not found with this phone number.";
        return;
      }

      if (existingUsers[userIndex].pin !== pin) {
        resetError.textContent = "Incorrect 4-digit PIN.";
        return;
      }

      resetError.textContent = "";

      // Save pending password update in sessionStorage
      sessionStorage.setItem('jw_pending_reset', JSON.stringify({ userIndex, newPassword }));

      // Generate random 6-digit OTP
      const generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
      sessionStorage.setItem('jw_reset_otp', generatedOTP);

      // Display OTP Modal
      document.getElementById('auto-generated-otp').textContent = generatedOTP;
      document.getElementById('otp-modal').classList.remove('hidden');
    }

    function confirmPasswordReset(e) {
      e.preventDefault();

      const inputOTP = document.getElementById('user-otp').value.trim();
      const expectedOTP = sessionStorage.getItem('jw_reset_otp');
      const otpError = document.getElementById('otp-error');

      if (inputOTP !== expectedOTP) {
        otpError.textContent = "Invalid OTP code.";
        return;
      }

      // Update password in localStorage
      const { userIndex, newPassword } = JSON.parse(sessionStorage.getItem('jw_pending_reset'));
      const existingUsers = JSON.parse(localStorage.getItem('jw_registered_users') || '[]');

      existingUsers[userIndex].password = newPassword;
      localStorage.setItem('jw_registered_users', JSON.stringify(existingUsers));

      // Update active user session if currently logged in
      const activeUser = JSON.parse(localStorage.getItem('jw_active_user') || '{}');
      if (activeUser.phone === existingUsers[userIndex].phone) {
        activeUser.password = newPassword;
        localStorage.setItem('jw_active_user', JSON.stringify(activeUser));
      }

      // Clear temp session
      sessionStorage.removeItem('jw_pending_reset');
      sessionStorage.removeItem('jw_reset_otp');

      alert("PASSWORD RESET SUCCESSFUL! Redirecting to Dashboard...");
      window.location.href = "index.html";
    }

    document.addEventListener('DOMContentLoaded', initTheme);

    /* --- SERVICE WORKER & PWA INSTALL LOGIC --- */
    let deferredPrompt;
    const installBtn = document.getElementById('pwa-install-btn');

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered successfully:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }

    // Capture PWA Install Prompt Event
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', () => {
      installBtn.style.display = 'none';
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => {
          deferredPrompt = null;
        });
      }
    });
  </script>
</body>
</html>
