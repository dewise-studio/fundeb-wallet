<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transfer Successful</title>

  <!-- Confetti library for receipt celebration -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary-dark: #0d1527;
      --accent-green: #10b981;
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    [data-theme="dark"] {
      --primary-dark: #0f172a;
      --accent-green: #10b981;
      --bg-light: #0b0f19;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .receipt-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .success-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      color: var(--accent-green);
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .receipt-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .receipt-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .receipt-details {
      background: var(--bg-light);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .detail-label { color: var(--text-muted); }
    .detail-value { font-weight: 600; color: var(--text-main); }

    .btn-done {
      width: 100%;
      padding: 14px;
      background: var(--primary-dark);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      display: block;
    }

    [data-theme="dark"] .btn-done {
      background: var(--accent-green);
    }
  </style>
</head>
<body>

  <div class="receipt-card">
    <div class="success-icon">✓</div>
    <h2 class="receipt-title">Transfer Successful!</h2>
    <p class="receipt-subtitle">Your funds have been delivered successfully.</p>

    <div class="receipt-details">
      <div class="detail-row">
        <span class="detail-label">Amount Sent</span>
        <span class="detail-value" id="rc-amount">₦0.00</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Recipient</span>
        <span class="detail-value" id="rc-name">---</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Bank</span>
        <span class="detail-value" id="rc-bank">---</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Account Number</span>
        <span class="detail-value" id="rc-acc">---</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Fee Charged</span>
        <span class="detail-value" id="rc-fee">₦10.00</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Date & Time</span>
        <span class="detail-value" id="rc-date">---</span>
      </div>
    </div>

    <a href="index.html" class="btn-done">Done & Return Home</a>
  </div>

  <script>
    function loadReceipt() {
      const savedTheme = localStorage.getItem('jw_theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);

      const data = JSON.parse(localStorage.getItem('jw_last_transfer'));
      if (data) {
        document.getElementById('rc-amount').textContent = `₦${parseFloat(data.amount).toLocaleString('en-NG', {minimumFractionDigits: 2})}`;
        document.getElementById('rc-name').textContent = data.accName;
        document.getElementById('rc-bank').textContent = data.bank;
        document.getElementById('rc-acc').textContent = data.accNum;
        document.getElementById('rc-fee').textContent = `₦${parseFloat(data.fee).toFixed(2)}`;
        document.getElementById('rc-date').textContent = data.date;
      }

      if (typeof confetti === 'function') {
        confetti({ particleCount: 70, spread: 50, origin: { y: 0.3 } });
      }
    }

    document.addEventListener('DOMContentLoaded', loadReceipt);
  </script>
</body>
</html>
